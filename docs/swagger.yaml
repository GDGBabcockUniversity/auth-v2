definitions:
  github_com_GDGBabcockUniversity_auth-v2_internal_httpapi_dto.AdminCreateRequest:
    properties:
      email:
        example: jane.doe@babcock.edu.ng
        type: string
      full_name:
        example: Jane Doe
        type: string
      roles:
        example:
        - user
        items:
          type: string
        type: array
      teams:
        example:
        - core
        items:
          type: string
        type: array
    type: object
  github_com_GDGBabcockUniversity_auth-v2_internal_httpapi_dto.AdminDetailResponse:
    properties:
      success:
        type: boolean
      user:
        $ref: '#/definitions/github_com_GDGBabcockUniversity_auth-v2_internal_httpapi_dto.AdminUserDetail'
    type: object
  github_com_GDGBabcockUniversity_auth-v2_internal_httpapi_dto.AdminListResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      success:
        type: boolean
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/github_com_GDGBabcockUniversity_auth-v2_internal_httpapi_dto.AdminUser'
        type: array
    type: object
  github_com_GDGBabcockUniversity_auth-v2_internal_httpapi_dto.AdminUpdateRequest:
    properties:
      avatar_url:
        type: string
      birthday:
        example: "2000-01-15"
        type: string
      department:
        example: Computer Science
        type: string
      faculty:
        type: string
      full_name:
        description: Profile fields an admin may correct on someone else's record.
        example: Jane Doe
        type: string
      gender:
        type: string
      is_active:
        example: true
        type: boolean
      matric_no:
        example: 20/1234
        type: string
      primary_skill_level:
        type: string
      primary_track:
        type: string
      roles:
        example:
        - user
        - admin
        items:
          type: string
        type: array
      secondary_skill_level:
        type: string
      secondary_track:
        type: string
      student_status:
        type: string
      teams:
        example:
        - core
        items:
          type: string
        type: array
      whatsapp_number:
        example: "+2348012345678"
        type: string
    type: object
  github_com_GDGBabcockUniversity_auth-v2_internal_httpapi_dto.AdminUser:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_login_at:
        type: string
      pending:
        type: boolean
      roles:
        items:
          type: string
        type: array
      teams:
        items:
          type: string
        type: array
    type: object
  github_com_GDGBabcockUniversity_auth-v2_internal_httpapi_dto.AdminUserDetail:
    properties:
      avatar_url:
        type: string
      birthday:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      department:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      faculty:
        type: string
      firebase_uid:
        type: string
      full_name:
        type: string
      gender:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_login_at:
        type: string
      matric_no:
        type: string
      pending:
        type: boolean
      primary_skill_level:
        type: string
      primary_track:
        type: string
      roles:
        items:
          type: string
        type: array
      secondary_skill_level:
        type: string
      secondary_track:
        type: string
      student_status:
        type: string
      teams:
        items:
          type: string
        type: array
      tos_agreed:
        type: boolean
      tos_agreed_at:
        type: string
      tos_version:
        type: string
      updated_at:
        type: string
      whatsapp_number:
        type: string
    type: object
  github_com_GDGBabcockUniversity_auth-v2_internal_httpapi_dto.AdminUserResponse:
    properties:
      success:
        type: boolean
      user:
        $ref: '#/definitions/github_com_GDGBabcockUniversity_auth-v2_internal_httpapi_dto.AdminUser'
    type: object
  github_com_GDGBabcockUniversity_auth-v2_internal_httpapi_dto.ErrorResponse:
    properties:
      error:
        type: string
      success:
        type: boolean
    type: object
  github_com_GDGBabcockUniversity_auth-v2_internal_httpapi_dto.HealthResponse:
    properties:
      status:
        type: string
    type: object
  github_com_GDGBabcockUniversity_auth-v2_internal_httpapi_dto.LoginRequest:
    properties:
      firebase_token:
        example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
