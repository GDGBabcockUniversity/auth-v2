openapi: 3.0.3
info:
  title: GDG Babcock Auth Service
  description: |
    Authentication API for GDG Babcock. Firebase Authentication handles sign-in.
    Clients send a Firebase ID token to `POST /auth/login`; the service verifies it,
    preserves the user's PostgreSQL UUID, and issues platform JWTs (access + refresh).

    **Authentication:** Most endpoints require a Bearer access token in the
    `Authorization` header. Admin endpoints additionally require the `admin` role.
  version: 2.0.0
  contact:
    name: GDG Babcock University

servers:
  - url: /
    description: Current host

tags:
  - name: Health
    description: Service health checks
  - name: Auth
    description: Login, tokens, profile, and session management
  - name: Admin
    description: Admin-only user management (requires `admin` role)

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns service health status. No authentication required.
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: healthy

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with Firebase ID token
      description: |
        Verifies a Firebase ID token, creates the user on first login if needed,
        and returns platform access + refresh tokens.
        Email verification is not required to sign in.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              firebase_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Inactive"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Exchanges a valid refresh token for a new access + refresh token pair.
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            example:
              refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: |
        Invalidates the current session. Optionally pass a specific refresh token
        to revoke. Requires a valid access token.
      operationId: logout
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
            example:
              refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
              example:
                success: true
                message: Logged out successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      description: Returns the full profile of the authenticated user.
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Inactive"

  /auth/profile:
    put:
      tags: [Auth]
      summary: Update current user profile
      description: |
        Updates allowed profile fields for the authenticated user.
        Only the following keys are accepted; others result in 400:

        - `full_name`, `whatsapp_number`, `avatar_url`, `gender`, `birthday`
        - `student_status`, `matric_no`, `department`, `faculty`
        - `primary_track`, `secondary_track`, `primary_skill_level`, `secondary_skill_level`
        - `tos_agreed` (boolean), `tos_agreed_at`, `tos_version`

        At least one field is required. Non-boolean fields must be strings (or null).
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
            example:
              full_name: Jane Doe
              whatsapp_number: "+2348012345678"
              department: Computer Science
              tos_agreed: true
              tos_version: "1.0"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Inactive"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/verify:
    get:
      tags: [Auth]
      summary: Verify access token
      description: Validates the Bearer access token and returns the token claims.
      operationId: verifyToken
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Inactive"

  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      description: Paginated list of users. Requires authenticated user with `admin` role.
      operationId: adminListUsers
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (1-based). Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Page size. Defaults to 20, max 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: Search filter (email / name).
          schema:
            type: string
        - name: role
          in: query
          description: Filter by role.
          schema:
            type: string
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permissions or inactive account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                forbidden:
                  value:
                    success: false
                    error: Insufficient permissions
                inactive:
                  value:
                    success: false
                    error: Account is inactive

  /admin/users/{id}:
    put:
      tags: [Admin]
      summary: Update user (admin)
      description: |
        Admin update of a user. Allowed fields only:

        - `roles` — array of strings
        - `teams` — array of strings
        - `is_active` — boolean

        Requires authenticated user with `admin` role.
      operationId: adminUpdateUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Target user UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateRequest"
            example:
              roles: [member, admin]
              teams: [core]
              is_active: true
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Insufficient permissions or inactive account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform access token issued by `POST /auth/login` or `POST /auth/refresh`.

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: Invalid request
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: Authentication required
    Inactive:
      description: Account is inactive
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: Account is inactive
    Conflict:
      description: Account needs identity linking (email already linked to another Firebase UID)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: Account needs identity linking
    NotFound:
      description: User not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: User not found

  schemas:
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: healthy

    LoginRequest:
      type: object
      required: [firebase_token]
      properties:
        firebase_token:
          type: string
          description: Firebase ID token from client sign-in
          minLength: 1

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token previously issued by this service
          minLength: 1

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Optional specific refresh token to revoke

    ProfileUpdateRequest:
      type: object
      description: |
        Partial profile update. At least one property required.
        String fields accept string or null; `tos_agreed` must be boolean.
      additionalProperties: false
      properties:
        full_name:
          type: string
          nullable: true
        whatsapp_number:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        birthday:
          type: string
          nullable: true
          description: Date string (e.g. YYYY-MM-DD)
        student_status:
          type: string
          nullable: true
        matric_no:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        faculty:
          type: string
          nullable: true
        primary_track:
          type: string
          nullable: true
        secondary_track:
          type: string
          nullable: true
        primary_skill_level:
          type: string
          nullable: true
        secondary_skill_level:
          type: string
          nullable: true
        tos_agreed:
          type: boolean
        tos_agreed_at:
          type: string
          nullable: true
        tos_version:
          type: string
          nullable: true

    AdminUpdateRequest:
      type: object
      description: Admin-only fields. At least one property required.
      additionalProperties: false
      properties:
        roles:
          type: array
          items:
            type: string
            minLength: 1
        teams:
          type: array
          items:
            type: string
            minLength: 1
        is_active:
          type: boolean

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds

    LoginUser:
      type: object
      required: [id, email, full_name, roles, teams]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
        teams:
          type: array
          items:
            type: string

    LoginResponse:
      type: object
      required: [success, user, tokens]
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: "#/components/schemas/LoginUser"
        tokens:
          $ref: "#/components/schemas/TokenPair"

    TokensResponse:
      type: object
      required: [success, tokens]
      properties:
        success:
          type: boolean
          example: true
        tokens:
          $ref: "#/components/schemas/TokenPair"

    LogoutResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Logged out successfully

    ProfileUser:
      type: object
      required:
        - id
        - firebase_uid
        - email
        - full_name
        - email_verified
        - teams
        - roles
        - tos_agreed
        - created_at
        - updated_at
        - is_active
      properties:
        id:
          type: string
          format: uuid
        firebase_uid:
          type: string
        email:
          type: string
          format: email
        full_name:
          type: string
        whatsapp_number:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        email_verified:
          type: boolean
        gender:
          type: string
          nullable: true
        birthday:
          type: string
          nullable: true
        student_status:
          type: string
          nullable: true
        matric_no:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        faculty:
          type: string
          nullable: true
        primary_track:
          type: string
          nullable: true
        secondary_track:
          type: string
          nullable: true
        primary_skill_level:
          type: string
          nullable: true
        secondary_skill_level:
          type: string
          nullable: true
        teams:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        tos_agreed:
          type: boolean
        tos_agreed_at:
          type: string
          format: date-time
          nullable: true
        tos_version:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean

    ProfileResponse:
      type: object
      required: [success, user]
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: "#/components/schemas/ProfileUser"

    Claims:
      type: object
      description: JWT access token claims returned by verify
      properties:
        roles:
          type: array
          items:
            type: string
        token_type:
          type: string
          example: access
        iss:
          type: string
        sub:
          type: string
          description: User ID
        aud:
          type: array
          items:
            type: string
        exp:
          type: integer
          format: int64
        iat:
          type: integer
          format: int64
        jti:
          type: string

    VerifyResponse:
      type: object
      required: [success, valid, user]
      properties:
        success:
          type: boolean
          example: true
        valid:
          type: boolean
          example: true
        user:
          $ref: "#/components/schemas/Claims"

    AdminUser:
      type: object
      required: [id, email, full_name, roles, teams, is_active, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
        teams:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true

    AdminListResponse:
      type: object
      required: [success, users, total, page, limit]
      properties:
        success:
          type: boolean
          example: true
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
          format: int64
        page:
          type: integer
        limit:
          type: integer

    AdminUserResponse:
      type: object
      required: [success, user]
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: "#/components/schemas/AdminUser"